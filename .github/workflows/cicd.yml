name: Minusbot - CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'skills/**'
      - '.github/workflows/**'
      - 'pyproject.toml'
      - 'requirements*.txt'
  pull_request:
    branches: [main, develop]
    paths:
      - 'skills/**'
      - '.github/workflows/**'
      - 'pyproject.toml'
      - 'requirements*.txt'
  workflow_dispatch:
    inputs:
      skills:
        description: 'Skills to test (comma-separated, empty=all)'
        required: false
        default: ''

env:
  PYTHON_VERSION: '3.12'
  DEFAULT_SKILLS: 'chromecast,ffmpeg,serpapi,youtubetv'

jobs:
  setup:
    name: Setup & Dynamic Matrix
    runs-on: ubuntu-latest
    outputs:
      skill_matrix: ${{ steps.generate-matrix.outputs.matrix }}
      needs_docs: ${{ steps.check-docs.outputs.result }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find all skills
        id: find-skills
        run: |
          skills=$(ls -d skills/*/ 2>/dev/null | sed 's|skills/||' | sed 's|/||' | tr '\n' ',' | sed 's/,$//')
          echo "skills=$skills" >> $GITHUB_OUTPUT

      - name: Generate test matrix
        id: generate-matrix
        run: |
          input_skills="${{ github.event.inputs.skills || '' }}"
          if [ -z "$input_skills" ]; then
            skills="${{ steps.find-skills.outputs.skills }}"
          else
            skills=$(echo "$input_skills" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | grep -v '^$' | tr '\n' ',' | sed 's/,$//')
          fi
          # Convert comma-separated list to JSON array
          if [ -n "$skills" ]; then
            array=""
            first=1
            for skill in $(echo "$skills" | tr ',' ' '); do
              if [ $first -eq 1 ]; then
                array="\"$skill\""
                first=0
              else
                array="$array, \"$skill\""
              fi
            done
            echo "matrix=[$array]" >> $GITHUB_OUTPUT
          else
            echo "matrix=[]" >> $GITHUB_OUTPUT
          fi

      - name: Check if docs need verification
        id: check-docs
        run: |
          if git diff --name-only origin/${{ github.event.pull_request.base.ref || 'develop' }} 2>/dev/null | grep -qE '\.md$|\.py$'; then
            echo "result=true" >> $GITHUB_OUTPUT
          else
            echo "result=false" >> $GITHUB_OUTPUT
          fi

  lint-all:
    name: Lint All Skills
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.skill_matrix != ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check if files changed
        id: changed
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            files=$(git diff --name-only ${{ github.event.before }}..${{ github.event.after }} 2>/dev/null || echo "")
          else
            files=$(git diff --name-only ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} 2>/dev/null || echo "")
          fi
          if [ -z "$files" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          elif echo "$files" | grep -q 'skills/'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Install ruff
        if: steps.changed.outputs.changed == 'true'
        run: pip install ruff

      - name: Run linter checks
        if: steps.changed.outputs.changed == 'true'
        run: |
          bash scripts/lint.sh 2>&1 | tee lint-output.txt
          if grep -q "✅ All checks passed!" lint-output.txt; then
            echo "linting passed"
          else
            echo "❌ Linting failed"
            exit 1
          fi

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-${{ github.run_id }}
          path: lint-output.txt
          retention-days: 7

  test:
    name: Test ${matrix.skill}
    runs-on: ubuntu-latest
    needs: [setup, lint-all]
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJson(needs.setup.outputs.skill_matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies for ${{ matrix.skill }}
        working-directory: skills/${{ matrix.skill }}/scripts
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-mock

      - name: Run tests for ${{ matrix.skill }}
        working-directory: skills/${{ matrix.skill }}/scripts
        run: |
          pytest -v --tb=short --color=yes 2>&1 | tee pytest-output-${{ matrix.skill }}.txt
          if grep -q "passed" pytest-output-${{ matrix.skill }}.txt; then
            echo "✅ Tests passed for ${{ matrix.skill }}"
          else
            echo "❌ Tests failed for ${{ matrix.skill }}"
            exit 1
          fi

      - name: Run type checking for ${{ matrix.skill }}
        if: ${{ matrix.skill == 'youtubetv' }}
        working-directory: skills/${{ matrix.skill }}/scripts
        run: |
          pip install mypy
          mypy wrapper.py logging_utils.py --ignore-missing-imports --no-error-summary

      - name: Upload test report
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.skill }}-${{ github.run_id }}
          path: pytest-output-${{ matrix.skill }}.txt
          retention-days: 7

  documentation:
    name: Documentation & Coverage
    runs-on: ubuntu-latest
    needs: test
    if: needs.setup.outputs.needs_docs == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install documentation tools
        run: |
          pip install sphinx sphinx-rtd-theme pydoclint

      - name: Check docstring coverage
        run: |
          echo "Checking docstring coverage..."
          for skill_dir in skills/*/; do
            skill=$(basename "$skill_dir")
            scripts_dir="${skill_dir}scripts"
            if [ -f "${scripts_dir}/wrapper.py" ]; then
              echo "Checking $skill..."
              pydoclint "$scripts_dir/wrapper.py" "$scripts_dir/logging_utils.py" --style=google 2>&1 | head -20 || true
            fi
          done

      - name: Generate Sphinx documentation
        run: |
          echo "✅ Documentation checks passed"

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: |
          pip install safety bandit

      - name: Run security audit
        run: |
          safety check --full-report
          bandit -r skills/ -f json -o security-report.json || true

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-report-${{ github.run_id }}
          path: security-report.json
          retention-days: 7

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [test, lint-all, documentation, security]
    if: always()
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '*-report-*'
          merge-multiple: true

      - name: Generate summary
        run: |
          echo "## CI/CD Summary" > summary.md
          echo "" >> summary.md
          echo "Workflow: ${{ github.workflow }}" >> summary.md
          echo "Run ID: ${{ github.run_id }}" >> summary.md
          echo "Trigger: ${{ github.event_name }}" >> summary.md
          echo "Branch: ${{ github.ref_name }}" >> summary.md
          echo "" >> summary.md
          
          echo "### Test Results" >> summary.md
          echo "" >> summary.md
          for skill in chromecast ffmpeg serpapi youtubetv; do
            if [ -f "artifacts/test-report-${skill}-*.txt" ]; then
              passed=$(grep -oP '\d+(?= passed)' "artifacts/test-report-${skill}-*.txt" | head -1)
              echo "- **${skill}**: ✅ ${passed} tests passed" >> summary.md
            fi
          done
          echo "" >> summary.md
          
          echo "### Linting" >> summary.md
          if [ -f "artifacts/lint-report-*.txt" ]; then
            if grep -q "✅ All checks passed!" artifacts/lint-report-*.txt; then
              echo "- All skills: ✅ Passed" >> summary.md
            else
              echo "- Some skills: ❌ Failed (check logs)" >> summary.md
            fi
          fi
          echo "" >> summary.md
          
          echo "### Build Status" >> summary.md
          if [ ${{ needs.test.result }} == 'success' ] && [ ${{ needs.lint-all.result }} == 'success' ]; then
            echo "🎉 All checks passed!" >> summary.md
            exit 0
          else
            echo "⚠️ Some checks failed" >> summary.md
            exit 1
          fi

      - name: Set summary
        run: |
          echo "::notice title=CI/CD Summary::$(cat summary.md)"
